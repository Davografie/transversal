services:
  seed:
    build: ./api
    command: python -m transversal seed
    environment:
      ARANGO_URL: "http://arango:8529"
    depends_on:
      arango:
        condition: service_healthy
    restart: "no"
    profiles:
      - tools

  api:
    build: ./api
    ports:
      - "8085:8080"
    environment:
      ARANGO_URL: "http://arango:8529"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      arango:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./api/src:/app/src
      - ./api/tests:/app/tests
      - ../media:/app/media
      - api_data:/app/data

  arango:
    image: arangodb:3.12
    environment:
      ARANGO_ROOT_PASSWORD: "${ARANGO_ROOT_PASSWORD:-transversal}"
    ports:
      - "8531:8529"
    volumes:
      - arango_data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://root:${ARANGO_ROOT_PASSWORD:-transversal}@127.0.0.1:8529/_api/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/vite.config.js:/app/vite.config.js
      - ../media:/app/media
    environment:
      - NODE_ENV=development

volumes:
  arango_data:
  redis_data:
