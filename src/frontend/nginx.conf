server {
    listen 80;
    server_name _;

    # ── Shared-password access control ──────────────────────────────
    auth_basic "Transversal";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /usr/share/nginx/html;
    index index.html;

    # ── API ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (EventSource) needs unbuffered streaming.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Media ──────────────────────────────────────────────────────────
    # The API serves /media (StaticFiles with immutable cache headers).
    location /media/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Service worker / PWA assets ────────────────────────────────────
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json";
    }

    # ── SPA fallback + static assets ───────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets can be cached long-term (immutable filenames).
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
