# Trust the terminating edge's protocol when one is present: a Cloudflare Tunnel
# terminates TLS and sends `X-Forwarded-Proto: https`, which lets the API mark
# the session cookie Secure. Falls back to our own scheme for direct/LAN access,
# so plain-HTTP access keeps working. (SEC-5)
map $http_x_forwarded_proto $tv2_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Magic-link entry (ungated) ───────────────────────────────────
    # Passage links land here. SEC-3: `?s=<join token>` admits a device to the
    # campaign (one QR for the whole table, reusable for ~30 minutes), and
    # `?a=<architect key>` is the architect's own way in. Both exchange for a
    # signed session cookie naming the player taken, then redirect to the app.
    location = /enter {
        proxy_pass http://api:8080/api/v1/auth/enter$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tv2_forwarded_proto;
    }

    # ── Internal auth check (auth_request target) ────────────────────
    location = /_auth {
        internal;
        proxy_pass http://api:8080/api/v1/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # ── API ────────────────────────────────────────────────────────────

    # The account tier is the way *in*, so it cannot itself demand a session:
    # registering, verifying and signing in are precisely what a visitor without
    # one does, and the portal's own calls would otherwise 401 at this door before
    # reaching the API. It is the **whole** tier — `/forks` too, because the
    # switcher's callers are signed-in account holders with no campaign session
    # yet, and every route there enforces `require_account` itself.
    #
    # Still narrow: an account session is **not** a campaign session, so
    # `/api/v1/auth/check` refuses it and everything else under /api/ stays gated
    # (SEC-6).
    location ^~ /api/v1/accounts/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tv2_forwarded_proto;
    }

    location ^~ /api/v1/forks {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tv2_forwarded_proto;
    }

    location /api/ {
        auth_request /_auth;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tv2_forwarded_proto;

        # SSE (EventSource) needs unbuffered streaming.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Media ──────────────────────────────────────────────────────────
    # The API serves /media (StaticFiles with immutable cache headers).
    # `^~` (SEC-11): a regex location beats a plain prefix, so without this the
    # asset rule below swallowed every .png/.gif/.jpg/.svg under /media — served
    # from the SPA root instead of proxied, which 404'd them and silently skipped
    # the auth_request gate. .webp/.webm are absent from that regex, which is
    # exactly why generated images worked and the bug stayed hidden.
    location ^~ /media/ {
        auth_request /_auth;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Service worker / PWA assets ────────────────────────────────────
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json";
    }

    # ── SPA fallback + static assets ───────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets can be cached long-term (immutable filenames).
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
