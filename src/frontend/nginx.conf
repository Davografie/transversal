# Trust the terminating edge's protocol when one is present: a Cloudflare Tunnel
# terminates TLS and sends `X-Forwarded-Proto: https`, which lets the API mark
# the session cookie Secure. Falls back to our own scheme for direct/LAN access,
# so plain-HTTP access keeps working. (SEC-5)
map $http_x_forwarded_proto $tv2_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Magic-link entry (ungated) ───────────────────────────────────
    # The QR encodes /enter?t=<ACCESS_TOKEN>; this exchanges the token for a
    # signed session cookie and redirects to the app.
    location = /enter {
        proxy_pass http://api:8080/api/v1/auth/enter$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tv2_forwarded_proto;
    }

    # ── Internal auth check (auth_request target) ────────────────────
    location = /_auth {
        internal;
        proxy_pass http://api:8080/api/v1/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # ── API ────────────────────────────────────────────────────────────
    location /api/ {
        auth_request /_auth;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tv2_forwarded_proto;

        # SSE (EventSource) needs unbuffered streaming.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Media ──────────────────────────────────────────────────────────
    # The API serves /media (StaticFiles with immutable cache headers).
    location /media/ {
        auth_request /_auth;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Uploads are served from the app's own origin; never let a browser
        # sniff a content type other than the one declared (SEC-4).
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Service worker / PWA assets ────────────────────────────────────
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json";
    }

    # ── SPA fallback + static assets ───────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets can be cached long-term (immutable filenames).
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
