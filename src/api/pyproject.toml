[project]
name = "transversal"
version = "0.1.0"
description = "Transversal VTTRPG backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "strawberry-graphql[fastapi]>=0.217.0",
    "pydantic>=2.5.0",
    "python-arango>=8.0.0",
    "redis>=5.0.0",
    "sse-starlette>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "Pillow>=10.0.0",
    "pillow-heif>=0.13.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
