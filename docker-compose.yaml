services:
  seed:
    build: ./src/api
    container_name: tv2_seed
    command: python -m transversal seed
    environment:
      ARANGO_URL: "http://arango:8529"
    depends_on:
      arango:
        condition: service_healthy
    restart: "no"
    profiles:
      - tools

  api:
    build: ./src/api
    container_name: tv2_api
    ports:
      - "8085:8080"
    environment:
      ARANGO_URL: "http://arango:8529"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      arango:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./src/api/src:/app/src
      - ./src/api/tests:/app/tests
      - ./src/imagen/workflows:/app/workflows
      - ./media:/app/media
      - api_data:/app/data

  arango:
    image: arangodb:3.12
    container_name: tv2_arango
    environment:
      ARANGO_ROOT_PASSWORD: "transversal"
    ports:
      - "8531:8529"
    volumes:
      - arango_data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://root:transversal@127.0.0.1:8529/_api/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tv2_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  frontend:
    build: ./src/frontend
    container_name: tv2_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend/src:/app/src
      - ./src/frontend/public:/app/public
      - ./src/frontend/vite.config.js:/app/vite.config.js
      - ./media:/app/media
    environment:
      - NODE_ENV=development

  imagen:
    build: ./src/imagen
    image: tv2_imagen
    container_name: tv2_imagen
    volumes:
      - ${MODEL_FOLDER:-/dev/null}:/app/ComfyUI/models
      - ./media:/app/media
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: 1
    ports:
      - "8190:8188"
      - "8191:8191"
      - "11435:11434"

volumes:
  arango_data:
    name: code_arango_data
    external: true
  redis_data:
    name: code_redis_data
    external: true
  api_data:
    name: code_api_data
    external: true
  ollama_data:
    name: code_ollama_data
