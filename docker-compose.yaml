services:
  seed:
    build: ./src/api
    container_name: tv2_seed
    command: python -m transversal seed
    environment:
      ARANGO_URL: "http://arango:8529"
    depends_on:
      arango:
        condition: service_healthy
    restart: "no"
    profiles:
      - tools

  api:
    build: ./src/api
    container_name: tv2_api
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      ARANGO_URL: "http://arango:8529"
      ARANGO_ROOT_PASSWORD: "${ARANGO_ROOT_PASSWORD}"
      ACCESS_TOKEN: "${ACCESS_TOKEN}"
      SESSION_SECRET: "${SESSION_SECRET}"
      # SEC-3: the architect's own way in (/enter?a=…). It has to be listed here
      # or it sits in .env unseen — compose only passes what the service names.
      ARCHITECT_TOKEN: "${ARCHITECT_TOKEN}"
      ARCHITECT_NAME: "${ARCHITECT_NAME:-Architect}"
      # B82: the naming seam. A key in `.env` alone sits unseen for the same
      # reason as the token above — compose passes only what the service names.
      # Behind the Name is the only public source with a `usage=chinese`, so the
      # key is what makes the thematic themes real rather than curated.
      BEHINDTHENAME_KEY: "${BEHINDTHENAME_KEY:-}"
      # Remote naming is ON here because a key is configured. Naming always falls
      # back to the local generator, so this is a preference, never a dependency;
      # set NAME_REMOTE=0 to keep it strictly offline (see [[Name Generation]]).
      NAME_REMOTE: "${NAME_REMOTE:-1}"
      REDIS_URL: "redis://redis:6379"
      # ── Tenancy: accounts, forks and routing (B255/B88) ───────────────
      # Listed for exactly the reason ARCHITECT_TOKEN is: compose passes only what
      # a service names, so a value in `.env` alone sits unseen. Here the symptom
      # is quiet — routing is "on" but every host serves the same campaign, and
      # mail falls back to the console — with nothing logged to say why.
      # Empty means "use the code default"; the defaults are in
      # `db/registry.py`, `services/provisioner.py` and `services/mailer.py`.
      #
      # The registry is its own database (never a campaign's), and GLOBAL_DATABASE
      # is what a new fork is cloned FROM — until the global is split out of the
      # played-in database (the owner's 2026-10-16 decision) that is `transversal`.
      REGISTRY_DATABASE: "${REGISTRY_DATABASE:-}"
      GLOBAL_DATABASE: "${GLOBAL_DATABASE:-}"
      # The domain forks hang off: `<slug>.<this>`. Empty switches host routing off.
      FORKS_BASE_DOMAIN: "${FORKS_BASE_DOMAIN:-}"
      # Self-service fork creation — who may create a campaign is the owner's call,
      # so this is off unless it is truthy.
      FORKS_ALLOW_CREATE: "${FORKS_ALLOW_CREATE:-}"
      # Account links: `console` logs them (dev); `smtp` uses the block below; any
      # other value fails loudly rather than dropping the only credential.
      MAIL_TRANSPORT: "${MAIL_TRANSPORT:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-}"
      SMTP_SSL: "${SMTP_SSL:-}"
      # Send caps, per address and per deployment (B255). Code defaults: 3 / 60 / 900s.
      MAIL_MAX_PER_ADDRESS: "${MAIL_MAX_PER_ADDRESS:-}"
      MAIL_MAX_PER_WINDOW: "${MAIL_MAX_PER_WINDOW:-}"
      MAIL_RATE_WINDOW_SECONDS: "${MAIL_RATE_WINDOW_SECONDS:-}"
      # How many campaign connections stay open at once (the B88 LRU bound).
      DB_CACHE_MAX: "${DB_CACHE_MAX:-}"
    depends_on:
      arango:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./src/api/src:/app/src
      - ./src/api/tests:/app/tests
      - ./src/imagen/workflows:/app/workflows
      - ./media:/app/media
      - api_data:/app/data

  arango:
    image: arangodb:3.12
    container_name: tv2_arango
    environment:
      ARANGO_ROOT_PASSWORD: "${ARANGO_ROOT_PASSWORD}"
    ports:
      - "127.0.0.1:8531:8529"
    volumes:
      - arango_data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://root:$${ARANGO_ROOT_PASSWORD}@127.0.0.1:8529/_api/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tv2_redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data

  frontend:
    build: ./src/frontend
    container_name: tv2_frontend
    # Dev server: loopback by default. It proxies /api straight to the API and so
    # BYPASSES the nginx magic-link gate — binding 0.0.0.0 publishes the entire
    # unauthenticated API to the LAN (SEC-2, docs/Technical/Security Posture.md).
    # For mobile testing, opt in explicitly and knowingly:
    #     DEV_BIND_ADDR=0.0.0.0 docker compose up -d frontend
    ports:
      - "${DEV_BIND_ADDR:-127.0.0.1}:3000:3000"
    volumes:
      - ./src/frontend/src:/app/src
      - ./src/frontend/public:/app/public
      - ./src/frontend/vite.config.js:/app/vite.config.js
      - ./media:/app/media
    environment:
      - NODE_ENV=development

  frontend-prod:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.prod
    container_name: tv2_frontend_prod
    ports:
      - "3001:80"
    depends_on:
      - api

  imagen:
    build: ./src/imagen
    image: tv2_imagen
    container_name: tv2_imagen
    volumes:
      - ${MODEL_FOLDER:-/dev/null}:/app/ComfyUI/models
      - ./media:/app/media
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: 1
    ports:
      - "127.0.0.1:8190:8188"
      - "127.0.0.1:8191:8191"
      - "127.0.0.1:11435:11434"

volumes:
  arango_data:
    name: code_arango_data
    external: true
  redis_data:
    name: code_redis_data
    external: true
  api_data:
    name: code_api_data
    external: true
  ollama_data:
    name: code_ollama_data
    external: true
