# The campaign-hostname hop (B88).
#
# A campaign is an ArangoDB database, and a request names its campaign in the
# **Host** (``<slug>.transversal.app``) — see ``api/tenancy.py``. The public way in
# is Caddy on the VPS, which reaches this desktop over the tailnet through
# ``tailscale serve``. Serve picks its backend by **Host**: the only Host it answers
# for is the node's own (``ptdave:3001``) and anything else is a 404 before nginx
# sees it. So a campaign's hostname cannot survive that hop in the Host header, and
# this hop puts it back.
#
# Caddy sends the client's original hostname in ``X-Forwarded-Host`` (it sets that
# header anyway; the Caddyfile states it explicitly), and it sends ``Host:
# ptdave:3010`` so that serve routes here. Both are restored below.
#
# The tailnet entry itself (``http://ptdave:3010``) arrives with no
# ``X-Forwarded-Host``, and defaults to the **global multiverse** — which is what
# makes the global authorable before a campaign DNS record exists. Everything else
# about the request is passed through untouched, including the scheme, because
# ``X-Forwarded-Proto`` is what marks the session cookie ``Secure``.
map $http_x_forwarded_host $tv2_campaign_host {
    default $http_x_forwarded_host;
    ""      global.transversal.app;
}

server {
    listen 80;

    location / {
        proxy_pass http://tv2_frontend_prod:80;
        proxy_http_version 1.1;
        proxy_set_header Host $tv2_campaign_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Deliberately not invented: plain-HTTP tailnet access must stay non-Secure
        # or the browser drops the cookie it was just given.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
